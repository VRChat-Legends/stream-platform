name: vrchat-stream
services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:18080:3000"]
    volumes: ["data:/data"]
    init: true
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 768m
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
  mediamtx:
    build: ./media
    env_file: .env
    restart: unless-stopped
    user: "1000:1000"
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro"]
    ports: ["1935:1935", "8554:8554", "127.0.0.1:18888:8888"]
    depends_on: {backend: {condition: service_healthy}}
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    logging: {driver: json-file, options: {max-size: 10m, max-file: "2"}}
  program:
    build: ./program
    restart: unless-stopped
    env_file: .env
    volumes: ["data:/data"]
    depends_on: [mediamtx]
    init: true
    cpus: 2.25
    mem_limit: 1500m
    security_opt: ["no-new-privileges:true"]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
volumes:
  data:
